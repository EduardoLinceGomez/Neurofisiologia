[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofisiologia"
version = "0.1.0"
description = "Modelo pedagógico de un bastón pasivo con tres compartimentos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]
widgets = ["ipywidgets>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
